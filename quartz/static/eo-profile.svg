<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 240" width="860" height="240">
  <defs>
    <marker id="arr-s" markerWidth="6" markerHeight="6" refX="3" refY="3" orient="auto">
      <path d="M6,0 L0,3 L6,6" fill="none" stroke="#666" stroke-width="1.2"/>
    </marker>
    <marker id="arr-e" markerWidth="6" markerHeight="6" refX="3" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6" fill="none" stroke="#666" stroke-width="1.2"/>
    </marker>
  </defs>

  <!-- Gold flight path band -->
  <polygon points="860,215 645,179 430,117 215,117 0,55 0,30 215,93 430,93 645,157 860,197"
           fill="#C49A00" opacity="0.85"/>

  <!-- Ground line -->
  <line x1="0" y1="215" x2="860" y2="215" stroke="#999" stroke-width="1.5"/>

  <!-- Segment dividers -->
  <line x1="215" y1="20" x2="215" y2="215" stroke="#aaa" stroke-width="1" stroke-dasharray="4,4"/>
  <line x1="430" y1="20" x2="430" y2="215" stroke="#aaa" stroke-width="1" stroke-dasharray="4,4"/>
  <line x1="645" y1="20" x2="645" y2="215" stroke="#aaa" stroke-width="1" stroke-dasharray="4,4"/>

  <!-- Gross Gradient label -->
  <text x="430" y="16" text-anchor="middle" font-family="sans-serif" font-size="10" font-weight="600" fill="#444">Gross Gradient min 2,4% (2-ENG) · min 3,0% (4-ENG)</text>

  <!-- Net Gradient bidirectional arrow -->
  <line x1="370" y1="96" x2="370" y2="114"
        stroke="#666" stroke-width="1.2"
        marker-start="url(#arr-s)" marker-end="url(#arr-e)"/>
  <text x="378" y="101" font-family="sans-serif" font-size="9" fill="#666">Net Gradient</text>
  <text x="378" y="113" font-family="sans-serif" font-size="9" fill="#666">−0,8% (2-ENG) / −1,0% (4-ENG)</text>

  <!-- 35 ft annotation at liftoff -->
  <line x1="853" y1="197" x2="853" y2="215" stroke="#aaa" stroke-width="1" stroke-dasharray="3,3"/>
  <text x="845" y="211" font-family="sans-serif" font-size="9" text-anchor="middle" fill="#777">35 ft</text>

  <!-- Segment labels below ground -->
  <text x="108" y="229" font-family="sans-serif" font-size="10" text-anchor="middle" fill="#777">Final Segment</text>
  <text x="323" y="229" font-family="sans-serif" font-size="10" text-anchor="middle" fill="#777">3. Segment</text>
  <text x="538" y="229" font-family="sans-serif" font-size="10" text-anchor="middle" fill="#777">2. Segment</text>
  <text x="753" y="229" font-family="sans-serif" font-size="10" text-anchor="middle" fill="#777">1. Segment</text>

  <!-- 35 ft / 15 ft wet note -->
  <text x="645" y="239" font-family="sans-serif" font-size="8.5" text-anchor="middle" fill="#999">35 ft / 15 ft wet or contaminated</text>
</svg>
